[package]
name = "macs-fan"
version = "0.16.0"
description = "Read-only local AppleSMC monitoring"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "=1.11.3"

[dependencies]
tauri = { version = "=2.12.5", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "=0.2.191"
getrandom = "=0.3.4"

[profile.release]
strip = true
lto = "thin"
