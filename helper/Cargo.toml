[package]
name = "macs-fan-helper-bridge"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
description = "Dry-run NSXPC protocol adapter for macs-fan control core"

[lib]
crate-type = ["rlib", "staticlib"]

[features]
# Never enabled by the normal XPC probe. Enables only local native fault tests.
test-harness = []

[dependencies]
macs-fan-control-core = { path = "../control-core" }
macs-fan-control-runtime = { path = "../control-runtime" }
macs-fan-smc-adapter = { path = "../smc-adapter" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
